server.port=8081
spring.application.name=notification


spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group-v2
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.spring.json.type.mapping=OtpVerificationEvent:com.example.notification.event.OtpVerificationEvent,userRegisterEvent:com.example.notification.event.UserRegisterEvent

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=
spring.mail.password=

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.profiles.active=local
